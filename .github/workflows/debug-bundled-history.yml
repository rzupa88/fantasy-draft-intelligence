name: Debug bundled NFLverse startup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Run complete browser suite
        id: browser
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-diagnostic.json
        run: npx playwright test --reporter=json

      - name: Summarize failures
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("playwright-diagnostic.json")
          lines = ["## Focused Playwright diagnostic"]
          if not report_path.exists():
              lines.append("Playwright did not produce a JSON report.")
          else:
              report = json.loads(report_path.read_text(encoding="utf-8"))
              failures = []
              for suite in report.get("suites", []):
                  stack = [suite]
                  while stack:
                      current = stack.pop()
                      stack.extend(current.get("suites", []))
                      for spec in current.get("specs", []):
                          for test in spec.get("tests", []):
                              for result in test.get("results", []):
                                  if result.get("status") not in {"passed", "skipped"}:
                                      errors = result.get("errors") or []
                                      message = "\n".join(
                                          error.get("message", str(error)) if isinstance(error, dict) else str(error)
                                          for error in errors
                                      )
                                      failures.append((spec.get("title", "unknown test"), message))
              if failures:
                  lines.append(f"Failed results: {len(failures)}")
                  for title, message in failures[:10]:
                      lines.extend([f"### {title}", "```text", message[:4000], "```"])
              else:
                  lines.append("The complete browser suite passed in the diagnostic workflow.")
          Path("playwright-diagnostic.md").write_text("\n\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Post diagnostic to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file playwright-diagnostic.md
