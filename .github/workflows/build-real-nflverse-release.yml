name: Build real NFLverse release

on:
  pull_request:

jobs:
  build-release:
    if: github.head_ref == 'agent/m4-real-nflverse-release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Capture Black formatting diff
        run: |
          black --diff \
            packages/data/nflverse_release_filter.py \
            scripts/build_nflverse_history_release.py \
            tests/test_nflverse_release_filter.py \
            > artifacts/black.diff || true

      - name: Build 2025/2026 NFLverse history release
        run: |
          python scripts/build_nflverse_history_release.py \
            --prior-season 2025 \
            --roster-season 2026 \
            --output artifacts/nflverse_history_2025_2026.json

      - name: Capture unresolved UDK identities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import nflreadpy as nfl

          names = {
              'Fernando Mendoza',
              'Carson Beck',
              'Travis Hunter',
              'Marquise Brown',
              'Brenen Thompson',
          }
          players = nfl.load_players()
          rosters = nfl.load_rosters(seasons=[2026])

          def matching_rows(frame):
              columns = [
                  column
                  for column in (
                      'gsis_id',
                      'player_id',
                      'nfl_id',
                      'display_name',
                      'full_name',
                      'player_name',
                      'football_name',
                      'position',
                      'position_group',
                      'team',
                      'team_abbr',
                      'status',
                  )
                  if column in frame.columns
              ]
              rows = []
              for row in frame.select(columns).iter_rows(named=True):
                  searchable = ' '.join(str(value) for value in row.values() if value is not None).lower()
                  if any(all(part.lower() in searchable for part in name.split()) for name in names):
                      rows.append(row)
              return rows

          payload = {
              'players': matching_rows(players),
              'rosters_2026': matching_rows(rosters),
              'player_columns': players.columns,
              'roster_columns': rosters.columns,
          }
          Path('artifacts/unresolved_identities.json').write_text(
              json.dumps(payload, indent=2, default=str),
              encoding='utf-8',
          )
          PY

      - name: Summarize release
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          path = Path('artifacts/nflverse_history_2025_2026.json')
          release = json.loads(path.read_text(encoding='utf-8'))
          players = release['players']
          positions = Counter(player['position'] for player in players)
          with_history = sum(player['prior_season_stats'] is not None for player in players)
          active = sum(player.get('roster_status') == 'ACT' for player in players)
          print(f"players={len(players)}")
          print(f"with_history={with_history}")
          print(f"without_history={len(players) - with_history}")
          print(f"active={active}")
          print(f"positions={dict(sorted(positions.items()))}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: nflverse-history-2025-2026
          path: |
            artifacts/nflverse_history_2025_2026.json
            artifacts/unresolved_identities.json
            artifacts/black.diff
          retention-days: 14
