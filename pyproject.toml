[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-draft-intelligence"
version = "0.1.0"
description = "Local-first fantasy football draft intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Ryan Zupa" }
]
dependencies = [
  "beautifulsoup4>=4.12.0",
  "duckdb>=1.0.0",
  "lxml>=5.2.0",
  "nflreadpy>=0.1.0",
  "pandas>=2.2.0",
  "polars>=1.0.0",
  "pyarrow>=16.0.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "requests>=2.32.0",
  "rich>=13.7.1",
  "scikit-learn>=1.5.0",
  "typer>=0.12.3"
]

[project.optional-dependencies]
dev = [
  "black>=24.4.2",
  "ipykernel>=6.29.4",
  "jupyter>=1.0.0",
  "pytest>=8.2.0",
  "ruff>=0.5.0"
]

[tool.setuptools]
packages = ["packages.data", "packages.data.ingest", "packages.modeling", "packages.shared"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
